<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postfix Puzzle – DSA Stack Project</title>
<style>
:root{--bg:#eef0e8;--ink:#23291f;--muted:#5f6856;--card:#fff;--line:#c9cfbd;--accent:#7a3fb0;--ok:#1d7a46;--bad:#b0352a}
@media (prefers-color-scheme:dark){:root{--bg:#171a14;--ink:#e8ecdf;--muted:#98a28b;--card:#21251c;--line:#394032;--accent:#c39bf0;--ok:#62d08f;--bad:#ff8174}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif;padding:20px}
main{max-width:760px;margin:0 auto}
h1{margin:0 0 4px;font-size:1.8rem}
.sub{color:var(--muted);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 10px}
.tokens{display:flex;flex-wrap:wrap;gap:8px;font:1.4rem Consolas,monospace}
.tok{padding:4px 12px;border:1px solid var(--line);border-radius:6px}
.tok.done{opacity:.4}.tok.now{border-color:var(--accent);border-width:2px;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:12px}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stackwrap{display:flex;gap:20px;align-items:flex-end}
.stack{display:flex;flex-direction:column-reverse;gap:4px;min-height:60px;width:150px;border:2px solid var(--ink);border-top:none;padding:6px;border-radius:0 0 8px 8px;min-height:90px}
.item{background:var(--bg);border:1px solid var(--line);text-align:center;padding:4px;font:1.1rem Consolas,monospace;border-radius:4px}
.item.top{border-color:var(--accent);border-width:2px}
#says{flex:1;color:var(--muted);min-height:3em}
#res{margin:10px 0 0;font-weight:bold;min-height:1.5em}
.ok{color:var(--ok)}.bad{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Postfix puzzle</h1>
<p class="sub">Solve the expression in your head, then step through it with a stack to see how a computer does it.</p>

<section class="box">
<h2>Expression</h2>
<div class="tokens" id="tokens" aria-live="polite"></div>
<div class="row">
<label>Your answer <input id="ans" type="number" style="width:110px"></label>
<button id="check">Check answer</button>
<button id="new" class="alt">New puzzle</button>
</div>
<p id="res" role="status"></p>
</section>

<section class="box">
<h2>Stack</h2>
<div class="stackwrap">
<div class="stack" id="stack" aria-label="Stack, top item is highlighted"></div>
<div id="says">Press “Step” to read the first token.</div>
</div>
<div class="row">
<button id="step">Step</button>
<button id="all" class="alt">Run all</button>
<button id="reset" class="alt">Restart</button>
</div>
</section>

<section class="box">
<h2>Try your own expression</h2>
<div class="row">
<label>Separate tokens with spaces <input id="custom" placeholder="3 4 + 2 *" style="width:240px"></label>
<button id="load" class="alt">Load</button>
</div>
</section>
</main>

<script>
// ---- Stack (array-backed) ----
class Stack {
  constructor(){ this.items = []; }
  push(x){ this.items.push(x); }                       // O(1)
  pop(){ return this.items.length ? this.items.pop() : undefined; } // O(1)
  peek(){ return this.items[this.items.length - 1]; }
  get size(){ return this.items.length; }
}

const OPS = { '+': (a,b)=>a+b, '-': (a,b)=>a-b, '*': (a,b)=>a*b };
const $ = id => document.getElementById(id);
let tokens = [], pos = 0, st = new Stack(), answer = 0;

// Evaluate a whole expression (used for the answer key). Returns null if invalid.
function evaluate(list){
  const s = new Stack();
  for (const t of list){
    if (t in OPS){
      if (s.size < 2) return null;
      const b = s.pop(), a = s.pop(); s.push(OPS[t](a,b));
    } else if (t !== '' && !isNaN(Number(t))) s.push(Number(t));
    else return null;
  }
  return s.size === 1 ? s.peek() : null;
}

// Random valid postfix expression with 3–4 numbers
function makePuzzle(){
  const nums = 3 + Math.floor(Math.random()*2);
  const out = []; let need = nums, have = 0;
  while (need > 0 || have > 1){
    const canOp = have >= 2;
    if (need > 0 && (!canOp || Math.random() < .55)){ out.push(String(1 + Math.floor(Math.random()*9))); need--; have++; }
    else { out.push(Object.keys(OPS)[Math.floor(Math.random()*3)]); have--; }
  }
  return out;
}

function load(list){
  tokens = list; pos = 0; st = new Stack(); answer = evaluate(list);
  $('res').textContent = ''; $('res').className = ''; $('ans').value = '';
  $('says').textContent = 'Press “Step” to read the first token.';
  draw();
}

function draw(){
  $('tokens').innerHTML = '';
  tokens.forEach((t,i) => {
    const d = document.createElement('span');
    d.className = 'tok' + (i < pos-1 ? ' done' : i === pos-1 ? ' now' : '');
    d.textContent = t; $('tokens').append(d);
  });
  $('stack').innerHTML = '';
  st.items.forEach((v,i) => {
    const d = document.createElement('div');
    d.className = 'item' + (i === st.size-1 ? ' top' : ''); d.textContent = v; $('stack').append(d);
  });
  $('step').disabled = pos >= tokens.length;
  $('all').disabled = pos >= tokens.length;
}

function step(){
  if (pos >= tokens.length) return;
  const t = tokens[pos++];
  if (t in OPS){
    const b = st.pop(), a = st.pop(), r = OPS[t](a,b);
    st.push(r);
    $('says').textContent = `"${t}" is an operator: pop ${b} and ${a}, compute ${a} ${t} ${b} = ${r}, push ${r}.`;
  } else {
    st.push(Number(t));
    $('says').textContent = `"${t}" is a number: push it onto the stack.`;
  }
  if (pos === tokens.length) $('says').textContent += ` Done. The answer is the single item left: ${st.peek()}.`;
  draw();
}

$('step').onclick = step;
$('all').onclick = () => { while (pos < tokens.length) step(); };
$('reset').onclick = () => load(tokens);
$('new').onclick = () => load(makePuzzle());
$('check').onclick = () => {
  const v = $('ans').value;
  if (v === ''){ $('res').textContent = 'Enter a number first.'; $('res').className = 'bad'; return; }
  const good = Number(v) === answer;
  $('res').textContent = good ? 'Correct!' : 'Not quite. Use Step to see how the stack gets the result.';
  $('res').className = good ? 'ok' : 'bad';
};
$('load').onclick = () => {
  const list = $('custom').value.trim().split(/\s+/).filter(Boolean);
  if (evaluate(list) === null){ $('res').textContent = 'Invalid expression. Use numbers and + - * with spaces, e.g. 3 4 + 2 *'; $('res').className = 'bad'; return; }
  load(list);
};

load(makePuzzle());
</script>
</body>
</html>
